name: Build and Deploy Thesis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-html:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript install.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build HTML
        run: make html
        env:
          RETICULATE_PYTHON: python3

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-html
          path: _output-html/

  build-pdf:
    runs-on: ubuntu-latest
    # Only build PDF on pushes to main (TinyTeX install is slow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Liberation Sans font
        run: sudo apt-get install -y fonts-liberation

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript install.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build PDF
        run: make pdf
        env:
          RETICULATE_PYTHON: python3

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: _output-pdf/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-html, build-pdf]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: thesis-html
          path: _site/

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: thesis-pdf
          path: _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
