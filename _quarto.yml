project:
  type: book
  output-dir: _output

book:
  title: "Thesis Title"
  author: "Author Name"
  date: today
  chapters:
    - index.qmd
    - chapters/02-literature.qmd
    - chapters/03-methodology.qmd
    - chapters/04-results.qmd
    - chapters/05-discussion.qmd
    - chapters/06-conclusion.qmd
    - chapters/07-appendix.qmd
    - references.qmd

format:
  pdf:
    pandoc-args:
      - --lua-filter=_extensions/msb/thesis/pattern-selector.lua
    template: _extensions/msb/thesis/template.tex
    keep-tex: true
    toc: true
    toc-depth: 3
    lof: true
    lot: true
    citeproc: true
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=2.5cm
      - right=2.5cm
    linestretch: 1.0
    fontsize: 12pt
    papersize: a4
    msb-thesis: true
    # Pragmatic sans-serif default (Arial-compatible)
    mainfont: "Liberation Sans"
    sansfont: "Liberation Sans"
    monofont: "Liberation Mono"
  html:
    pandoc-args:
      - --lua-filter=_extensions/msb/thesis/pattern-selector.lua
    include-after-body:
      - _extensions/msb/thesis/html-tweaks.html
    theme:
      - cosmo
      - _extensions/msb/thesis/fh-colors.scss
    toc: true
    toc-depth: 3
    citeproc: true

execute:
  warning: false
  message: false
  freeze: auto

bibliography: bib/references.bib
csl: csl/apa-de.csl

# Title page style
title-style: fh-pattern
title-pattern: 10
title-pattern-file: figures/pattern/pdf/Pattern_A4_CMYK_Blau_10.pdf

# Logos
fh-logo: figures/fhm_logo_aligned.png
msb-logo: figures/msb_logo_aligned.png

# FH Münster Corporate Colors
fh-blue: "#0014a0"
fh-yellow: "#ffd200"
fh-orange: "#ff821e"
fh-red: "#eb0041"
fh-cyan: "#00b4e6"
fh-green: "#00965a"
fh-black: "#1d1d1b"
fh-grey: "#868686"

# Language (IETF code for Quarto)
lang: de
# For English, simply set: lang: en

# Thesis metadata
logo: figures/fhm_logo_aligned.png
program: "Business Administration"
supervisor: "Prof. Dr. Erstbetreuer Name"
second-supervisor: "" # Optional
# second-supervisor: "Prof. Dr. Zweitbetreuer Name"
thesis-label: "Masterarbeit" # e.g. Masterarbeit or Bachelorarbeit
