project:
  type: book
  output-dir: _output

book:
  title: "Thesis Title"
  author: "Author Name"
  date: today
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-literature.qmd
    - chapters/03-methodology.qmd
    - chapters/04-results.qmd
    - chapters/05-discussion.qmd
    - chapters/06-conclusion.qmd
    # - references.qmd  # Uncomment after bibliography setup

format:
  pdf:
    template: _extensions/msb/thesis/template.tex
    keep-tex: true
    toc: true
    lof: true
    lot: true
    citeproc: false
  html:
    theme: cosmo
    citeproc: false

