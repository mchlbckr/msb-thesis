project:
  type: book
  output-dir: _output

book:
  title: "Thesis Title"
  author: "Author Name"
  date: today
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-literature.qmd
    - chapters/03-methodology.qmd
    - chapters/04-results.qmd
    - chapters/05-discussion.qmd
    - chapters/06-conclusion.qmd
    - references.qmd

format:
  pdf:
    msb-thesis: true
  html:
    theme: cosmo

bibliography: bib/references.bib
csl: csl/apa-de.csl

# Language settings
# For German (default):
lang: ngerman
# For English, uncomment:
# lang: english
# lang-english: true

# MSB-specific metadata
# Logos for header/footer
# fh-logo: path/to/fh-logo.png    # Top right header
# msb-logo: path/to/msb-logo.png  # Bottom right footer

# Layout:
# - Header left: Title + Author
# - Header right: FH Logo
# - Footer left: Page number
# - Footer right: MSB Logo

logo: _extensions/msb/thesis/assets/logo.png  # Title page logo (optional)
program: "Business Administration"
supervisor: "Prof. Dr. Supervisor Name"
