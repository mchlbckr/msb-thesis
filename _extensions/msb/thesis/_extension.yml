name: msb-thesis
title: MSB Thesis Template
author: Michael
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  filters:
    - pattern-selector.lua
  formats:
    pdf:
      template: template.tex
      msb-thesis: true
      toc: true
      toc-depth: 3
      lof: true
      lot: true
      citeproc: true
      geometry:
        - top=2.5cm
        - bottom=2.5cm
        - left=2.5cm
        - right=2.5cm
      linestretch: 1.0
      fontsize: 12pt
      papersize: a4
    html:
      toc: true
      toc-depth: 3
      citeproc: true
      theme:
        - cosmo
        - fh-colors.scss
